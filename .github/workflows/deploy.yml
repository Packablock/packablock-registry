name: Deploy Production to GCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write' # Required for Workload Identity Federation OIDC token request

env:
  PROJECT_ID: 'adwb-4444'
  REGION: 'us-west1'
  GAR_REPO: 'us-west1-docker.pkg.dev/adwb-4444/packablock-images'
  SERVICE_NAME: 'packablock-registry'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      # 1. Authenticate to Google Cloud using WIF OIDC
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/450487093520/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-deployer@adwb-4444.iam.gserviceaccount.com'

      # 2. Authenticate Docker with Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      # 3. Set up Docker Buildx (caching helper)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. Build & Tag Container Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --execution-environment=gen2
            --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=5,periodSeconds=5,failureThreshold=12,timeoutSeconds=5
