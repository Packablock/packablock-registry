name: "CI: Code Hygiene & Test Gates"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hygiene-check:
    name: "Typecheck, Lint, Format & Integration Tests"
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request') && !contains(github.event.head_commit.message, 'Merge branch') && !contains(github.event.head_commit.message, '(#'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Audit Dependency Vulnerabilities
        run: bun audit --audit-level=high
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}

      - name: Run CI Validation Gate
        run: bun run check-all
