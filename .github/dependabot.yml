version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      registry-dependencies:
        patterns:
          - "fastify*"
          - "@biomejs/*"
          - "typescript"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-updates:
        patterns:
          - "actions/*"
          - "oven-sh/*"
